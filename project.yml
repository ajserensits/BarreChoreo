name: BarreChoreography
options:
  xcodeVersion: "15.4"
  bundleIdPrefix: com.example.barre
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "13"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BarreChoreography:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.barre.instructor
        PRODUCT_NAME: BarreChoreography
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iPhone/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: BarreWatchApp
        embed: true
  BarreWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.barre.instructor.watchkitapp
        PRODUCT_NAME: BarreWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Barre Instructor
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.barre.instructor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  BarreChoreographyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BarreChoreography
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.barre.instructor.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BarreChoreography:
    build:
      targets:
        BarreChoreography: all
        BarreWatchApp: all
        BarreChoreographyTests: [test]
    test:
      targets:
        - BarreChoreographyTests

